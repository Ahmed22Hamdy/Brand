<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">

<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <span class="brand-logo me-2">BP</span>
        <span class="brand-text">Brand Pro</span>
      </a>
    </div>
  </nav>

  <main class="py-5">
    <div class="container">
      <h1 class="fw-bold mb-4">Your Cart</h1>
      <div class="row">
        <div class="col-lg-8">
          <div id="cartItems" class="list-group mb-4">
            <!-- Cart items injected by JS -->
          </div>
        </div>
        <aside class="col-lg-4">
          <div class="card p-3">
            <h5 class="fw-bold">Order Summary</h5>
            <div class="d-flex justify-content-between mt-2"><span>Subtotal</span><strong id="subtotal">$0</strong></div>
            <div class="d-flex justify-content-between mt-2"><span>Shipping</span><strong id="shipping">$0</strong></div>
            <hr>
            <div class="d-flex justify-content-between"><span>Total</span><strong id="total">$0</strong></div>
            <button id="checkoutBtn" class="btn btn-gold w-100 mt-3">Proceed to Checkout</button>
          </div>
        </aside>
      </div>
    </div>
  </main>

  <footer class="py-4 bg-dark text-light text-center small">
    <div class="container">&copy; 2026 Brand Pro</div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
