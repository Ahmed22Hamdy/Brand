<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Brand Pro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <span class="brand-logo me-2">BP</span>
        <span class="brand-text">Brand Pro</span>
      </a>
    </div>
  </nav>

  <main class="py-5">
    <div class="container">
      <div class="row gy-4">
        <div class="col-md-6">
          <h2 class="fw-bold">Contact Us</h2>
          <p class="text-muted">Questions? Reach out to our support team.</p>
          <ul class="list-unstyled small text-muted">
            <li><i class="bi bi-envelope-fill me-2"></i> hello@brandpro.com</li>
            <li><i class="bi bi-telephone-fill me-2"></i> +1 555 123 4567</li>
            <li><i class="bi bi-geo-alt-fill me-2"></i> 123 Premium Ave, New York, NY</li>
          </ul>
        </div>
        <div class="col-md-6">
          <div class="card p-3 shadow-sm">
            <form id="contactForm">
              <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" class="form-control" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Message</label>
                <textarea class="form-control" rows="4" required></textarea>
              </div>
              <button class="btn btn-gold">Send Message</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="py-4 bg-dark text-light text-center small">
    <div class="container">&copy; 2026 Brand Pro</div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
