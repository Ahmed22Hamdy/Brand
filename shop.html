<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop — Brand Pro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Navbar (reused structure) -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <span class="brand-logo me-2">BP</span>
        <span class="brand-text">Brand Pro</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav2" aria-controls="mainNav2" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav2">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-lg-center">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="shop.html">Shop</a></li>
          <li class="nav-item"><a class="nav-link" href="men.html">Men</a></li>
          <li class="nav-item"><a class="nav-link" href="women.html">Women</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
          <li class="nav-item ms-2"><a class="btn btn-outline-light btn-sm" href="cart.html"><i class="bi bi-cart-fill me-1"></i> Cart <span id="cart-count-2" class="badge bg-gold text-dark ms-1">0</span></a></li>
          <li class="nav-item ms-2 d-flex align-items-center">
            <div class="form-check form-switch m-0">
              <input class="form-check-input" type="checkbox" id="darkModeToggle2">
              <label class="form-check-label text-light small" for="darkModeToggle2">Dark</label>
            </div>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="py-5">
    <div class="container">
      <div class="row">
        <aside class="col-lg-3 mb-4">
          <div class="card p-3 sticky-sidebar">
            <h6 class="fw-bold">Search</h6>
            <input type="text" id="searchInput" class="form-control mb-3" placeholder="Search products">
            <h6 class="fw-bold">Category</h6>
            <select id="categoryFilter" class="form-select mb-3">
              <option value="all">All Categories</option>
              <option value="men">Men</option>
              <option value="women">Women</option>
              <option value="new">New</option>
            </select>
            <h6 class="fw-bold">Price</h6>
            <div class="d-flex align-items-center mb-2">
              <span class="small text-muted me-2">$0</span>
              <input type="range" min="0" max="500" value="500" id="priceRange" class="form-range">
              <span class="small text-muted ms-2" id="priceVal">$500</span>
            </div>
            <h6 class="fw-bold">Sort</h6>
            <select id="sortSelect" class="form-select">
              <option value="new">Newest</option>
              <option value="price-asc">Price: Low to High</option>
              <option value="price-desc">Price: High to Low</option>
              <option value="popular">Popularity</option>
            </select>
            <button id="clearFilters" class="btn btn-outline-secondary btn-sm w-100 mt-3">Clear</button>
          </div>
        </aside>
        <section class="col-lg-9">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold mb-0">Shop</h3>
            <p class="text-muted mb-0" id="resultsCount">Showing 0 results</p>
          </div>

          <div id="productsGrid" class="row g-4">
            <!-- Product cards populated by JS -->
          </div>
        </section>
      </div>
    </div>
  </main>

  <footer class="py-4 bg-dark text-light text-center small">
    <div class="container">&copy; 2026 Brand Pro — Premium Fashion</div>
  </footer>

  <button id="scrollTopBtn2" class="btn btn-gold scroll-top" title="Back to top"><i class="bi bi-arrow-up"></i></button>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
